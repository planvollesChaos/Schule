<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --paper:#FCFBF8;
  --paper-deep:#F3EFE6;
  --paper-edge:#DDD6C8;
  --ink:#1B1A1E;
  --ink-soft:#6E6A63;
  --ocean:#3D6BD6;
  --ocean-deep:#2C51AC;
  --coral:#8B6FC4;
  --coral-deep:#6B51A3;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#131316;
    --paper-deep:#1D1C22;
    --paper-edge:#312F39;
    --ink:#F3EFE7;
    --ink-soft:#A9A49B;
    --ocean:#7FA3F5;
    --ocean-deep:#A9C1FF;
    --coral:#B79AE8;
    --coral-deep:#CFB9F7;
  }
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 16% 6%, hsl(263 55% 62% / .11), transparent 42%),
    radial-gradient(circle at 88% 84%, hsl(222 70% 58% / .09), transparent 46%),
    var(--paper);
  color:var(--ink);
  font-family:"Atkinson Hyperlegible","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:36px 20px 70px;}
header{display:flex;align-items:center;gap:14px;margin-bottom:8px;}
header svg{width:52px;height:52px;flex:none;}
h1{font-family:"Baloo 2",sans-serif;font-size:30px;font-weight:800;margin:0;color:var(--ocean-deep);}
header p{margin:2px 0 0;color:var(--ink-soft);font-size:14.5px;}
h2{font-family:"Baloo 2",sans-serif;font-size:17px;margin:34px 0 14px;color:var(--ink);}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}
.subject{
  display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
  background:var(--paper-deep);border:2px solid var(--paper-edge);border-radius:18px;
  padding:20px 18px;transition:transform .12s ease, border-color .12s ease;
}
.subject:hover{transform:translateY(-3px);border-color:var(--coral);}
.subject .emoji{font-size:34px;flex:none;line-height:1;}
.subject h3{font-family:"Baloo 2",sans-serif;margin:0 0 3px;font-size:18px;}
.subject .meta{font-size:12.5px;color:var(--ink-soft);}
.subject.soon{opacity:.55;cursor:default;border-style:dashed;}
.subject.soon:hover{transform:none;border-color:var(--paper-edge);}
.hint{margin-top:34px;font-size:13px;color:var(--ink-soft);line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg viewBox="0 0 52 52" fill="none" aria-hidden="true">
      <circle cx="26" cy="26" r="23" stroke="var(--ocean-deep)" stroke-width="2.5" fill="var(--paper-deep)"/>
      <circle cx="26" cy="26" r="2.5" fill="var(--coral)"/>
      <path d="M26 10 L30 26 L26 42 L22 26 Z" fill="var(--coral)"/>
      <path d="M10 26 L26 22 L42 26 L26 30 Z" fill="var(--ocean)"/>
    </svg>
    <div>
      <h1>Schule</h1>
      <p>Übungen zum Selberlernen</p>
    </div>
  </header>

  <h2>Welches Fach möchtest du üben?</h2>
  <div class="subjects">
    <a class="subject" href="englisch/">
      <div class="emoji">🇬🇧</div>
      <div>
        <h3>Englisch</h3>
        <div class="meta">Wortschatz-Expedition · 116 Vokabeln</div>
      </div>
    </a>
    <div class="subject soon">
      <div class="emoji">🔢</div>
      <div>
        <h3>Mathe</h3>
        <div class="meta">kommt noch</div>
      </div>
    </div>
    <div class="subject soon">
      <div class="emoji">📚</div>
      <div>
        <h3>Deutsch</h3>
        <div class="meta">kommt noch</div>
      </div>
    </div>
  </div>

  <p class="hint">
    Tipp: Diese Seite lässt sich wie eine App auf den Startbildschirm legen –
    in Safari über das Teilen-Symbol, in Chrome über das Menü ⋮.
  </p>
</div>
</body>
</html>
