<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fahrrad-Führerschein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --paper:#FCFBF8; --paper-deep:#F3EFE6; --paper-edge:#DDD6C8;
  --ink:#1B1A1E; --ink-soft:#6E6A63;
  --ocean:#3D6BD6; --ocean-deep:#2C51AC;
  --coral:#8B6FC4; --coral-deep:#6B51A3;
  --gold:#A98FD6;
  --sage:#3F8A5C; --sage-bg:#E6F2E9;
  --berry:#C2506B; --berry-bg:#FAE9ED;
  --road:#C9C6BE; --grass:#EAEFE4;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#131316; --paper-deep:#1D1C22; --paper-edge:#312F39;
    --ink:#F3EFE7; --ink-soft:#A9A49B;
    --ocean:#7FA3F5; --ocean-deep:#A9C1FF;
    --coral:#B79AE8; --coral-deep:#CFB9F7;
    --gold:#C6ABF3;
    --sage:#6FCB93; --sage-bg:#1D3126;
    --berry:#E98BA4; --berry-bg:#35222A;
    --road:#3A3841; --grass:#22262133;
  }
}
*{box-sizing:border-box;}
body{
  margin:0;min-height:100vh;
  background:
    radial-gradient(circle at 16% 6%, hsl(263 55% 62% / .11), transparent 42%),
    radial-gradient(circle at 88% 84%, hsl(222 70% 58% / .09), transparent 46%),
    var(--paper);
  color:var(--ink);
  font-family:"Atkinson Hyperlegible","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Baloo 2",sans-serif;text-wrap:balance;}
button{font-family:inherit;}
#app{max-width:760px;margin:0 auto;padding:24px 18px 70px;}

.top{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.top .badge{font-size:40px;line-height:1;}
.top h1{font-size:27px;font-weight:800;margin:0;color:var(--ocean-deep);}
.top p{margin:2px 0 0;color:var(--ink-soft);font-size:14px;}
.back{display:inline-block;margin-bottom:18px;color:var(--ocean-deep);font-size:13.5px;text-decoration:none;}
.back:hover{text-decoration:underline;}

.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:24px;}
.mode{
  display:flex;gap:14px;align-items:flex-start;text-align:left;
  background:var(--paper-deep);border:2px solid var(--paper-edge);border-radius:18px;
  padding:18px 16px;cursor:pointer;color:var(--ink);
  transition:transform .12s ease,border-color .12s ease;
}
.mode:hover{transform:translateY(-3px);border-color:var(--coral);}
.mode .ic{font-size:30px;line-height:1;flex:none;}
.mode h3{margin:0 0 3px;font-size:17px;}
.mode .sub{font-size:12.5px;color:var(--ink-soft);}
.mode.exam{border-color:var(--coral);background:hsl(263 60% 62% / .1);}

.card{background:var(--paper-deep);border:2px solid var(--paper-edge);border-radius:20px;padding:22px 20px;text-align:center;}
.card h3{font-size:16px;color:var(--ink-soft);margin:0 0 14px;font-weight:700;}
.sign-wrap{display:flex;justify-content:center;margin:4px 0 16px;}
.sign-wrap svg{width:130px;height:130px;}
.scene{display:flex;justify-content:center;margin:4px 0 14px;}
.scene svg{width:100%;max-width:300px;height:auto;}
.qtext{font-size:18px;line-height:1.5;margin:6px 0 14px;}
.choices{display:grid;gap:10px;}
.choices.two{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.choice{
  padding:14px 12px;border-radius:14px;border:2px solid var(--paper-edge);background:var(--paper);
  font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);text-align:center;
}
.choice:hover:not(:disabled){border-color:var(--ocean);}
.choice.correct{background:var(--sage-bg);border-color:var(--sage);color:var(--sage);}
.choice.wrong{background:var(--berry-bg);border-color:var(--berry);color:var(--berry);}
.choice.sign{padding:8px;}
.choice.sign svg{width:78px;height:78px;}
.feedback{margin-top:14px;font-weight:700;min-height:22px;}
.feedback.ok{color:var(--sage);}
.feedback.no{color:var(--berry);}
.why{margin-top:8px;font-weight:400;font-size:14px;color:var(--ink-soft);line-height:1.6;}

.progressdots{display:flex;gap:5px;margin-bottom:18px;}
.progressdots i{flex:1;height:7px;border-radius:4px;background:var(--paper-edge);}
.progressdots i.done{background:var(--sage);}
.progressdots i.now{background:var(--gold);}
.progressdots i.miss{background:var(--berry);}

.btn{border:none;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
.btn-primary{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-deep);}
.btn-primary:active{transform:translateY(3px);box-shadow:none;}
.btn-ghost{background:transparent;color:var(--ocean-deep);border:2px solid var(--paper-edge);}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px;}

.stars{display:flex;justify-content:center;gap:4px;margin:12px 0;}
.stars svg{width:26px;height:26px;}
.result-line{font-size:16px;color:var(--ink-soft);}
.stat{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);margin-top:14px;}
.stat .bar{flex:1;height:10px;border-radius:5px;background:var(--paper-deep);overflow:hidden;}
.stat .bar i{display:block;height:100%;background:var(--ocean);}

.sheet{margin-top:26px;background:var(--paper-deep);border:1px solid var(--paper-edge);border-radius:16px;padding:16px 18px;}
.sheet h3{margin:0 0 10px;font-size:16px;}
.sheet ul{margin:0;padding-left:20px;line-height:1.8;font-size:14.5px;}
.sign-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px;margin-top:16px;}
.sign-gallery figure{margin:0;text-align:center;}
.sign-gallery svg{width:112px;height:112px;}
.sign-gallery figcaption{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.45;}
.sign-gallery figcaption b{color:var(--ink);font-size:13px;}
.sign-gallery .nr{display:block;font-size:10.5px;color:var(--coral);font-weight:700;letter-spacing:.4px;margin-bottom:1px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
/* ============================================================
   Verkehrszeichen nach dem Lernplakat zur Radfahrausbildung:
   Gefahrzeichen · Vorschriftzeichen · Richtzeichen
   Farben: Verkehrsrot RAL 3020, Verkehrsblau RAL 5017,
   Verkehrsgelb RAL 1023, Verkehrsgrün, Schwarz, Weiß
   ============================================================ */
const C = {red:"#CC0605", blue:"#0B4EA2", yellow:"#F6C400", green:"#008351",
  black:"#1A1A18", white:"#FFFFFF", grey:"#9B9B93", greyDark:"#6E6E67"};

/* ---------- Grundformen ---------- */
function discSign(fill, inner){
  return `<circle cx="50" cy="50" r="46" fill="${fill}"/>${inner||""}`;
}
function ringSign(inner, ringColor){
  return `<circle cx="50" cy="50" r="46" fill="${C.white}"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="${ringColor||C.red}" stroke-width="12"/>${inner||""}`;
}
function triangleUp(inner){
  return `<path d="M50 5 L97 87 A6 6 0 0 1 92 95 L8 95 A6 6 0 0 1 3 87 Z"
      fill="${C.white}" stroke="${C.red}" stroke-width="10" stroke-linejoin="round"/>${inner||""}`;
}
function squareSign(fill, inner){
  return `<rect x="4" y="4" width="92" height="92" rx="6" fill="${fill}"/>${inner||""}`;
}
function whiteSquare(inner){
  return `<rect x="4" y="4" width="92" height="92" rx="6" fill="${C.white}" stroke="#D9D3C6" stroke-width="2"/>${inner||""}`;
}
/* Graue Fassung mit Schrägstrichen – so sehen alle "Ende"-Schilder aus. */
function endeVariante(id, inner){
  return `<defs><clipPath id="cl-${id}"><rect x="4" y="4" width="92" height="92" rx="6"/></clipPath></defs>
    <rect x="4" y="4" width="92" height="92" rx="6" fill="#E8E6E0" stroke="#C9C6BE" stroke-width="2"/>
    <g opacity=".55">${inner}</g>
    <g clip-path="url(#cl-${id})" stroke="${C.greyDark}" stroke-width="5">
      <line x1="0" y1="96" x2="96" y2="0"/><line x1="18" y1="112" x2="112" y2="18"/>
      <line x1="-14" y1="82" x2="82" y2="-14"/>
    </g>`;
}

/* ---------- Piktogramme ---------- */
function bikePicto(color, x, y, s){
  return `<g transform="translate(${x},${y}) scale(${s})" stroke="${color}" stroke-width="3.2"
      fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-14" cy="7" r="9.5"/><circle cx="14" cy="7" r="9.5"/>
    <path d="M-14 7 L-5 -7 L9 -7 L14 7"/><path d="M-5 -7 L1 7"/>
    <path d="M-8 -11 L-2 -11"/><path d="M7 -12 L15 -12"/><path d="M9 -7 L12 -11"/>
  </g>`;
}
function personPicto(color, x, y, s){
  return `<g transform="translate(${x},${y}) scale(${s})" fill="${color}">
    <circle cx="0" cy="-14.5" r="4.6"/>
    <path d="M-1.5 -9.5 L-6.5 2 L-3.4 3.2 L0 -3.4 L3.4 3.2 L6.5 2 Z"/>
    <path d="M-4.2 3 L-6.5 14.5 L-3.2 15.2 L0 5.2 L3.2 15.2 L6.5 14.5 L4.2 3 Z"/>
  </g>`;
}
function childrenPicto(color){
  return `<g fill="${color}">
    <g transform="translate(42,64) scale(0.95)">
      <circle cx="0" cy="-15" r="4.8"/>
      <path d="M-2.2 -10 L-7.5 1 L-4.2 2.6 L0 -3.2 L4.2 2.6 L7.5 1 L2.2 -10 Z"/>
      <path d="M-4.2 2.6 L-7 15 L-3.4 15.8 L0 5.4 L3.4 15.8 L7 15 L4.2 2.6 Z"/>
    </g>
    <g transform="translate(63,68) scale(0.72)">
      <circle cx="0" cy="-15" r="5"/>
      <path d="M-2.2 -10 L-8.5 -0.5 L-5.2 1.6 L0 -3.2 L5.2 1.6 L8.5 -0.5 L2.2 -10 Z"/>
      <path d="M-4.2 1.6 L-7 15 L-3.4 15.8 L0 5.4 L3.4 15.8 L7 15 L4.2 1.6 Z"/>
    </g>
  </g>`;
}
function carPicto(color, x, y, s){
  return `<g transform="translate(${x},${y}) scale(${s})" fill="${color}">
    <path d="M-24 4 L-20 -6 Q-18 -10 -13 -10 L11 -10 Q16 -10 19 -6 L24 4 L24 9 Q24 11 22 11 L-22 11 Q-24 11 -24 9 Z"/>
    <circle cx="-13" cy="11" r="4.5"/><circle cx="13" cy="11" r="4.5"/>
  </g>`;
}
function arrowUp(color, x, y, w, h){
  const half = w/2, headW = w*1.9, headH = h*0.42;
  return `<path d="M${x-half} ${y+h/2} L${x-half} ${y-h/2+headH} L${x-headW/2} ${y-h/2+headH}
    L${x} ${y-h/2} L${x+headW/2} ${y-h/2+headH} L${x+half} ${y-h/2+headH} L${x+half} ${y+h/2} Z" fill="${color}"/>`;
}
function arrowDown(color, x, y, w, h){
  const half = w/2, headW = w*1.9, headH = h*0.42;
  return `<path d="M${x-half} ${y-h/2} L${x-half} ${y+h/2-headH} L${x-headW/2} ${y+h/2-headH}
    L${x} ${y+h/2} L${x+headW/2} ${y+h/2-headH} L${x+half} ${y+h/2-headH} L${x+half} ${y-h/2} Z" fill="${color}"/>`;
}

const SIGNS = {
/* ==================== GEFAHRZEICHEN ==================== */
  "gefahrstelle": {
    cat:"gefahr", nr:"101", name:"Gefahrstelle",
    meaning:"Achtung, hier ist etwas Gefährliches – langsam fahren und genau schauen.",
    svg:triangleUp(`<rect x="45" y="36" width="10" height="32" rx="3" fill="${C.black}"/>
      <circle cx="50" cy="77" r="5.6" fill="${C.black}"/>`)
  },
  "kreuzung-rechts": {
    cat:"gefahr", nr:"102", name:"Kreuzung oder Einmündung",
    meaning:"Kreuzung ohne Vorfahrtschilder – hier gilt rechts vor links.",
    svg:triangleUp(`<rect x="46" y="33" width="8" height="45" fill="${C.black}"/>
      <rect x="23" y="51.5" width="54" height="8" fill="${C.black}"/>`)
  },
  "kurve": {
    cat:"gefahr", nr:"103", name:"Kurve",
    meaning:"Gleich kommt eine Kurve – langsamer werden und nicht schneiden.",
    svg:triangleUp(`<path d="M42 80 L42 58 Q42 44 56 44 L62 44" fill="none" stroke="${C.black}"
        stroke-width="9" stroke-linecap="butt"/>
      <polygon points="58,33 74,44 58,55" fill="${C.black}"/>`)
  },
  "gefaelle": {
    cat:"gefahr", nr:"108", name:"Gefälle",
    meaning:"Es geht bergab – früh bremsen, sonst wirst du zu schnell.",
    svg:triangleUp(`<path d="M24 76 L76 44 L76 76 Z" fill="${C.black}"/>
      <text x="34" y="60" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="${C.black}">10%</text>`)
  },
  "unebene-fahrbahn": {
    cat:"gefahr", nr:"112", name:"Unebene Fahrbahn",
    meaning:"Die Straße hat Löcher oder Buckel – festhalten und langsam fahren.",
    svg:triangleUp(`<path d="M24 74 Q34 56 44 74 Z" fill="${C.black}"/>
      <path d="M52 74 Q64 52 76 74 Z" fill="${C.black}"/>
      <rect x="22" y="74" width="56" height="5" fill="${C.black}"/>`)
  },
  "verengte-fahrbahn": {
    cat:"gefahr", nr:"120", name:"Verengte Fahrbahn",
    meaning:"Die Straße wird von beiden Seiten schmaler – Abstand halten.",
    svg:triangleUp(`<g fill="${C.black}">
      <path d="M28 80 L28 66 L38 52 L38 80 Z"/><path d="M72 80 L72 66 L62 52 L62 80 Z"/></g>`)
  },
  "einseitig-verengt": {
    cat:"gefahr", nr:"121", name:"Einseitig verengte Fahrbahn",
    meaning:"Die Straße wird auf einer Seite schmaler.",
    svg:triangleUp(`<g fill="${C.black}">
      <path d="M72 80 L72 62 L60 48 L60 80 Z"/><rect x="32" y="48" width="6" height="32"/></g>`)
  },
  "arbeitsstelle": {
    cat:"gefahr", nr:"123", name:"Arbeitsstelle (Baustelle)",
    meaning:"Hier wird gebaut – besonders vorsichtig fahren, oft liegt Sand auf der Straße.",
    svg:triangleUp(`<g fill="${C.black}">
      <circle cx="46" cy="50" r="5"/>
      <path d="M42 56 L50 56 L54 74 L46 74 Z"/>
      <path d="M50 58 L66 44 L69 48 L54 62 Z"/>
      <path d="M62 40 L74 40 L74 48 L62 48 Z"/>
      <rect x="26" y="76" width="48" height="5"/></g>`)
  },
  "gegenverkehr-gefahr": {
    cat:"gefahr", nr:"125", name:"Gegenverkehr",
    meaning:"Achtung, dir kommen Fahrzeuge entgegen.",
    svg:triangleUp(`${arrowUp(C.black, 40, 62, 8, 34)}${arrowDown(C.black, 60, 62, 8, 34)}`)
  },
  "ampel": {
    cat:"gefahr", nr:"131", name:"Lichtzeichenanlage (Ampel)",
    meaning:"Gleich kommt eine Ampel – bereit sein zum Anhalten.",
    svg:triangleUp(`<rect x="40" y="38" width="20" height="44" rx="4" fill="${C.black}"/>
      <circle cx="50" cy="48" r="5.5" fill="#E4453B"/>
      <circle cx="50" cy="60" r="5.5" fill="${C.yellow}"/>
      <circle cx="50" cy="72" r="5.5" fill="#3FA45B"/>`)
  },
  "fussgaenger-gefahr": {
    cat:"gefahr", nr:"133", name:"Fußgänger",
    meaning:"Hier gehen viele Fußgänger über die Straße.",
    svg:triangleUp(personPicto(C.black, 50, 63, 1.15))
  },
  "achtung-kinder": {
    cat:"gefahr", nr:"136", name:"Kinder",
    meaning:"Hier spielen oft Kinder – langsam fahren und besonders aufpassen.",
    svg:triangleUp(childrenPicto(C.black))
  },
  "achtung-radfahrer": {
    cat:"gefahr", nr:"138", name:"Radverkehr",
    meaning:"Hier kreuzen Radfahrer – Autofahrer müssen mit euch rechnen.",
    svg:triangleUp(bikePicto(C.black, 50, 63, 0.95))
  },
  "bahnuebergang": {
    cat:"gefahr", nr:"151", name:"Bahnübergang",
    meaning:"Gleich kommen Schienen – anhalten, schauen, hören. Der Zug hat immer Vorfahrt.",
    svg:triangleUp(`<g fill="${C.black}">
      <path d="M30 72 L30 54 Q30 48 36 48 L58 48 Q64 48 64 54 L64 72 Z"/>
      <rect x="64" y="58" width="8" height="8"/>
      <circle cx="38" cy="76" r="4.5"/><circle cx="56" cy="76" r="4.5"/>
      <rect x="44" y="38" width="6" height="10"/></g>`)
  },
  "bake": {
    cat:"gefahr", nr:"159", name:"Zweistreifige Bake",
    meaning:"Noch etwa 160 Meter bis zum Bahnübergang.",
    svg:`<rect x="34" y="6" width="32" height="88" rx="3" fill="${C.white}" stroke="#D9D3C6" stroke-width="2"/>
      <g fill="${C.red}"><path d="M34 34 L66 14 L66 30 L34 50 Z"/><path d="M34 62 L66 42 L66 58 L34 78 Z"/></g>`
  },

/* ==================== VORSCHRIFTZEICHEN ==================== */
  "andreaskreuz": {
    cat:"vorschrift", nr:"201", name:"Andreaskreuz",
    meaning:"Hier kreuzt die Eisenbahn. Der Zug hat immer Vorfahrt – warten, bis frei ist.",
    /* Zwei gekreuzte Balken, weiß mit roten Enden. */
    svg:`<g transform="translate(50,50)">
        ${[28,-28].map(a=>`<g transform="rotate(${a})">
          <rect x="-46" y="-8" width="92" height="16" rx="2" fill="${C.white}" stroke="#D9D3C6" stroke-width="1"/>
          <rect x="-46" y="-8" width="28" height="16" rx="2" fill="${C.red}"/>
          <rect x="18" y="-8" width="28" height="16" rx="2" fill="${C.red}"/>
        </g>`).join("")}
      </g>`
  },
  "vorfahrt-gewaehren": {
    cat:"vorschrift", nr:"205", name:"Vorfahrt gewähren",
    meaning:"Du musst warten und die anderen zuerst fahren lassen.",
    svg:`<path d="M8 8 L92 8 A6 6 0 0 1 97 17 L55 92 A6 6 0 0 1 45 92 L3 17 A6 6 0 0 1 8 8 Z"
      fill="${C.white}" stroke="${C.red}" stroke-width="11" stroke-linejoin="round"/>`
  },
  "stop": {
    cat:"vorschrift", nr:"206", name:"Halt! Vorfahrt gewähren (Stop)",
    meaning:"Immer anhalten, schauen, dann erst weiterfahren.",
    svg:`<polygon points="31,3 69,3 97,31 97,69 69,97 31,97 3,69 3,31" fill="${C.red}"/>
      <polygon points="33,9 67,9 91,33 91,67 67,91 33,91 9,67 9,33" fill="none" stroke="${C.white}" stroke-width="5"/>
      <text x="50" y="61" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-size="26" font-weight="bold" fill="${C.white}" letter-spacing="1">STOP</text>`
  },
  "gegenverkehr-vorrang": {
    cat:"vorschrift", nr:"208", name:"Vorrang des Gegenverkehrs",
    meaning:"Die Straße wird eng. Du musst warten – der Gegenverkehr darf zuerst.",
    svg:ringSign(`${arrowDown(C.red, 38, 51, 14, 48)}${arrowUp(C.black, 63, 51, 7, 42)}`)
  },
  "geradeaus-rechts": {
    cat:"vorschrift", nr:"214", name:"Geradeaus oder rechts",
    meaning:"Hier darfst du nur geradeaus oder nach rechts fahren.",
    svg:discSign(C.blue, `<path d="M38 78 L38 40" stroke="${C.white}" stroke-width="11" stroke-linecap="butt"/>
      <polygon points="28,44 38,26 48,44" fill="${C.white}"/>
      <path d="M38 56 L60 56" stroke="${C.white}" stroke-width="11"/>
      <polygon points="56,44 76,56 56,68" fill="${C.white}"/>`)
  },
  "kreisverkehr": {
    cat:"vorschrift", nr:"215", name:"Kreisverkehr",
    meaning:"Wer schon im Kreis fährt, hat Vorfahrt. Beim Rausfahren Handzeichen geben.",
    svg:discSign(C.blue, `
      <g fill="none" stroke="${C.white}" stroke-width="6">
        <path d="M75.4 40.8 A27 27 0 0 0 50.9 23.0"/>
        <path d="M29.3 32.6 A27 27 0 0 0 26.2 62.7"/>
        <path d="M45.3 76.6 A27 27 0 0 0 72.9 64.3"/>
      </g>
      <g fill="${C.white}">
        <g transform="translate(47.6,23.1) rotate(175)"><polygon points="0,-5.5 9.5,0 0,5.5"/></g>
        <g transform="translate(27.9,65.5) rotate(55)"><polygon points="0,-5.5 9.5,0 0,5.5"/></g>
        <g transform="translate(74.5,61.4) rotate(-65)"><polygon points="0,-5.5 9.5,0 0,5.5"/></g>
      </g>`)
  },
  "einbahnstrasse": {
    cat:"vorschrift", nr:"220", name:"Einbahnstraße",
    meaning:"Hier fahren alle nur in Pfeilrichtung. Von der anderen Seite darfst du nicht hinein.",
    svg:`<rect x="2" y="27" width="96" height="46" rx="5" fill="${C.blue}"/>
      <g transform="translate(50,50) rotate(90)">${arrowUp(C.white, 0, 0, 11, 62)}</g>`
  },
  "rechts-vorbei": {
    cat:"vorschrift", nr:"222", name:"Rechts vorbei",
    meaning:"An dem Hindernis musst du rechts vorbeifahren.",
    svg:discSign(C.blue, `<g transform="translate(50,50) rotate(140)">${arrowUp(C.white, 0, 0, 13, 54)}</g>`)
  },

function signSvg(id){
  const s = SIGNS[id];
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${s.name}">${s.svg}</svg>`;
}

/* ============================================================
   Kreuzungs-Bilder für die Vorfahrtsfragen
   ============================================================ */
function bikeMarker(x, y, rot){
  return `<g transform="translate(${x},${y}) rotate(${rot})">
    <circle cx="0" cy="0" r="13" fill="#3D6BD6"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold" transform="rotate(${-rot})">DU</text>
  </g>`;
}
function carMarker(x, y, rot, color, label){
  return `<g transform="translate(${x},${y}) rotate(${rot})">
    <rect x="-11" y="-15" width="22" height="30" rx="5" fill="${color}"/>
    <rect x="-8" y="-9" width="16" height="9" rx="2" fill="#ffffff" opacity=".65"/>
    ${label ? `<text x="0" y="9" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" transform="rotate(${-rot})">${label}</text>` : ``}
  </g>`;
}
/* from: "unten" (du), "rechts", "links", "oben" */
const POS = {
  unten: {x:112, y:210, rot:0},
  oben:  {x:88,  y:30,  rot:180},
  rechts:{x:210, y:88,  rot:270},
  links: {x:30,  y:112, rot:90}
};
function crossingSvg(cfg){
  const others = (cfg.others||[]).map(o=>{
    const p = POS[o.from];
    return carMarker(p.x, p.y, p.rot, o.color||"#C2506B", o.label||"");
  }).join("");
  const you = POS.unten;
  const signs = (cfg.signs||[]).map(s=>{
    const map = {unten:{x:150,y:172}, oben:{x:50,y:28}, rechts:{x:172,y:50}, links:{x:28,y:150}};
    const p = map[s.at] || map.unten;
    return `<g transform="translate(${p.x - 13},${p.y - 13}) scale(0.26)">${SIGNS[s.id].svg}</g>`;
  }).join("");
  const arrows = cfg.arrow ? `<path d="${cfg.arrow}" stroke="#3D6BD6" stroke-width="3" fill="none" stroke-dasharray="6 5" marker-end="url(#ah)"/>` : ``;
  return `<svg viewBox="0 0 240 240" role="img" aria-label="Kreuzung">
    <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#3D6BD6"/></marker></defs>
    <rect width="240" height="240" fill="var(--grass)"/>
    <rect x="72" y="0" width="96" height="240" fill="var(--road)"/>
    <rect x="0" y="72" width="240" height="96" fill="var(--road)"/>
    <g stroke="#ffffff" stroke-width="3" stroke-dasharray="10 10" opacity=".75">
      <line x1="120" y1="0" x2="120" y2="72"/><line x1="120" y1="168" x2="120" y2="240"/>
      <line x1="0" y1="120" x2="72" y2="120"/><line x1="168" y1="120" x2="240" y2="120"/>
    </g>
    ${arrows}${others}${bikeMarker(you.x, you.y, you.rot)}${signs}
  </svg>`;
}

const SIGN_IDS = Object.keys(SIGNS);

/* Ohne cat: alle Schilder. Mit cat: nur eine Gruppe – die falschen Antworten
   kommen dann auch aus dieser Gruppe, sonst wäre es zu leicht zu erraten. */
function signQuestions(cat){
  const ids = cat ? SIGN_IDS.filter(id=>SIGNS[id].cat===cat) : SIGN_IDS;
  const pool = ids.length >= 4 ? ids : SIGN_IDS;
  const qs = [];
  ids.forEach(id=>{
    const wrong = pool.filter(x=>x!==id).sort(()=>Math.random()-0.5).slice(0,3);
    const opts = [id, ...wrong].sort(()=>Math.random()-0.5);
    qs.push({
      key:"sign-mean-"+id,
      head:"Was bedeutet dieses Schild?",
      visual:`<div class="sign-wrap">${signSvg(id)}</div>`,
      options: opts.map(o=>({label:SIGNS[o].name, correct:o===id})),
      why: SIGNS[id].meaning
    });
    const wrong2 = pool.filter(x=>x!==id).sort(()=>Math.random()-0.5).slice(0,3);
    const opts2 = [id, ...wrong2].sort(()=>Math.random()-0.5);
    qs.push({
      key:"sign-find-"+id,
      head:"Welches Schild ist das?",
      question: SIGNS[id].name,
      options: opts2.map(o=>({html:signSvg(o), correct:o===id, signOption:true})),
      why: SIGNS[id].meaning
    });
  });
  return qs;
}

/* ============================================================
   Fortschritt (lokal pro Gerät, eigener Schlüssel: rad:)
   ============================================================ */
function loadStats(){
  try{ return JSON.parse(localStorage.getItem("rad:stats") || "{}"); }catch(e){ return {}; }
}
function saveStats(s){ try{ localStorage.setItem("rad:stats", JSON.stringify(s)); }catch(e){} }
function noteResult(key, correct){
  const s = loadStats();
  const e = s[key] || {c:0, w:0};
  if(correct) e.c++; else e.w++;
  s[key] = e; saveStats(s);
}
function masteryPct(keys){
  const s = loadStats();
  let done = 0;
  keys.forEach(k=>{ if(s[k] && s[k].c > 0) done++; });
  return keys.length ? Math.round(done/keys.length*100) : 0;
}

function star(filled){
  return `<svg viewBox="0 0 20 20" fill="${filled?'var(--gold)':'var(--paper-edge)'}"><path d="M10 1l2.6 5.9 6.4.6-4.8 4.3 1.4 6.3L10 15l-5.6 3.1 1.4-6.3L1 8.5l6.4-.6z"/></svg>`;
}
function starsRow(n){
  let out=""; for(let i=0;i<5;i++) out += star(i<n);
  return `<div class="stars">${out}</div>`;
}

/* ============================================================
   Bildschirme
   ============================================================ */
const app = document.getElementById("app");
let session = null;

function header(){
  return `<div class="top"><div class="badge">🚲</div>
    <div><h1>Fahrrad-Führerschein</h1><p>Verkehrszeichen, Vorfahrt und Regeln üben</p></div></div>`;
}

function renderStart(){
  const signKeys = signQuestions().map(q=>q.key);
  const rowKeys = RIGHT_OF_WAY.map(q=>q.key);
  const ruleKeys = RULES.map(q=>q.key);
  const all = signKeys.concat(rowKeys, ruleKeys);
  app.innerHTML = `
    <a class="back" href="../">← Zurück zur Fächerauswahl</a>
    ${header()}
    <div class="stat"><span>Insgesamt geschafft</span><div class="bar"><i style="width:${masteryPct(all)}%"></i></div><span>${masteryPct(all)}%</span></div>
    <div class="modes">
      <button class="mode" data-mode="signs"><div class="ic">🚸</div>
        <div><h3>Verkehrszeichen</h3><div class="sub">${SIGN_IDS.length} Schilder in 3 Gruppen · ${masteryPct(signKeys)}% geschafft</div></div></button>
      <button class="mode" data-mode="row"><div class="ic">🚦</div>
        <div><h3>Vorfahrt</h3><div class="sub">Wer fährt zuerst? · ${masteryPct(rowKeys)}% geschafft</div></div></button>
      <button class="mode" data-mode="rules"><div class="ic">📋</div>
        <div><h3>Regeln & Fahrrad</h3><div class="sub">Ausrüstung und Verhalten · ${masteryPct(ruleKeys)}% geschafft</div></div></button>
      <button class="mode exam" data-mode="exam"><div class="ic">🏅</div>
        <div><h3>Prüfung üben</h3><div class="sub">15 gemischte Fragen wie im Test</div></div></button>
    </div>
    <div class="modes" style="margin-top:16px;">
      <button class="mode" data-mode="gallery"><div class="ic">📖</div>
        <div><h3>Schilder nachschlagen</h3><div class="sub">Alle Schilder mit Erklärung</div></div></button>
    </div>
    <div class="sheet">
      <h3>Das Wichtigste in Kürze</h3>
      <ul>
        <li><b>Reihenfolge:</b> Polizist → Ampel → Schilder → rechts vor links</li>
        <li><b>Abbiegen:</b> umschauen → Handzeichen → umschauen → abbiegen</li>
        <li><b>Fahrrad:</b> zwei Bremsen, Klingel, Licht vorne weiß / hinten rot, Reflektoren</li>
        <li><b>Zebrastreifen:</b> absteigen und schieben</li>
      </ul>
    </div>`;
  app.querySelectorAll("[data-mode]").forEach(b=>{
    b.onclick = ()=>{
      const m = b.getAttribute("data-mode");
      if(m==="gallery") renderGallery();
      else if(m==="signs") renderSignPicker();
      else startSession(m);
    };
  });
}

function renderGallery(){
  app.innerHTML = `
    <a class="back" href="#" id="back-start">← Zurück</a>
    ${header()}
    <h2 style="font-size:19px;margin:22px 0 4px;">Alle Schilder</h2>
    ${Object.keys(SIGN_CATS).map(cat=>{
      const ids = SIGN_IDS.filter(id=>SIGNS[id].cat===cat);
      if(!ids.length) return "";
      return `<h3 style="font-size:15px;margin:24px 0 2px;color:var(--ink-soft);">${SIGN_CATS[cat]}</h3>
        <div class="sign-gallery">
          ${ids.map(id=>`<figure>${signSvg(id)}
            <figcaption><span class="nr">${SIGNS[id].nr}</span><b>${SIGNS[id].name}</b><br>${SIGNS[id].meaning}</figcaption></figure>`).join("")}
        </div>`;
    }).join("")}`;
  app.querySelector("#back-start").onclick = e=>{ e.preventDefault(); renderStart(); };
}

function pickQuestions(mode, cat){
  const shuffle = a => a.slice().sort(()=>Math.random()-0.5);
  if(mode==="signs") return shuffle(signQuestions(cat)).slice(0, 12);
  if(mode==="row") return shuffle(RIGHT_OF_WAY);
  if(mode==="rules") return shuffle(RULES);
  const mix = shuffle(signQuestions()).slice(0,6)
    .concat(shuffle(RIGHT_OF_WAY).slice(0,5))
    .concat(shuffle(RULES).slice(0,4));
  return shuffle(mix);
}

function startSession(mode, cat){
  session = {mode, cat, qs: pickQuestions(mode, cat), idx:0, right:0, wrong:0, marks:[]};
  renderQuestion();
}
/* Bei 53 Schildern lohnt sich die Wahl: alle oder nur eine Gruppe. */
function renderSignPicker(){
  app.innerHTML = `
    <a class="back" href="#" id="back-start">← Zurück</a>
    ${header()}
    <h2 style="font-size:19px;margin:22px 0 4px;">Welche Schilder möchtest du üben?</h2>
    <div class="modes">
      <button class="mode" data-cat=""><div class="ic">🚸</div>
        <div><h3>Alle Schilder</h3><div class="sub">${SIGN_IDS.length} Stück, bunt gemischt</div></div></button>
      ${Object.keys(SIGN_CATS).map(cat=>{
        const n = SIGN_IDS.filter(id=>SIGNS[id].cat===cat).length;
        const icon = cat==="gefahr" ? "⚠️" : cat==="vorschrift" ? "⛔" : "ℹ️";
        const keys = signQuestions(cat).map(q=>q.key);
        return `<button class="mode" data-cat="${cat}"><div class="ic">${icon}</div>
          <div><h3>${SIGN_CATS[cat]}</h3><div class="sub">${n} Schilder · ${masteryPct(keys)}% geschafft</div></div></button>`;
      }).join("")}
    </div>`;
  app.querySelector("#back-start").onclick = e=>{ e.preventDefault(); renderStart(); };
  app.querySelectorAll("[data-cat]").forEach(b=>{
    b.onclick = ()=>startSession("signs", b.getAttribute("data-cat") || null);
  });
}

function renderQuestion(){
  const q = session.qs[session.idx];
  const opts = q.options.slice().sort(()=>Math.random()-0.5);
  const twoCols = opts.every(o=>o.signOption) || opts.length<=3;
  app.innerHTML = `
    <a class="back" href="#" id="abort">← Übung beenden</a>
    <div class="progressdots">
      ${session.qs.map((_,i)=>`<i class="${session.marks[i]||(i===session.idx?'now':'')}"></i>`).join("")}
    </div>
    <div class="card">
      <h3>${q.head}</h3>
      ${q.visual ? (q.visual.startsWith("<div") ? q.visual : `<div class="scene">${q.visual}</div>`) : ``}
      ${q.question ? `<div class="qtext">${q.question}</div>` : ``}
      <div class="choices ${twoCols?'two':''}">
        ${opts.map((o,i)=>`<button class="choice ${o.signOption?'sign':''}" data-i="${i}">${o.html || o.label}</button>`).join("")}
      </div>
      <div class="feedback" id="fb"></div>
    </div>`;
  app.querySelector("#abort").onclick = e=>{ e.preventDefault(); renderStart(); };
  const fb = app.querySelector("#fb");
  let attempts = 0, settled = false;
  app.querySelectorAll(".choice").forEach((btn,i)=>{
    btn.onclick = ()=>{
      if(settled || btn.classList.contains("wrong")) return;
      const o = opts[i];
      attempts++;
      if(o.correct){
        settled = true;
        btn.classList.add("correct");
        fb.className = "feedback ok";
        fb.innerHTML = (attempts===1 ? "Richtig! 🎉" : "Richtig!") + `<div class="why">${q.why}</div>`;
        /* "done" zählt nur der Treffer im ersten Anlauf – der zweite gilt als geübt, nicht als gekonnt. */
        session.marks[session.idx] = attempts===1 ? "done" : "miss";
        session.right++;
        noteResult(q.key, attempts===1);
        setTimeout(next, attempts===1 ? 1900 : 2600);
      }else if(attempts<2){
        btn.classList.add("wrong");
        btn.disabled = true;
        fb.className = "feedback no";
        fb.textContent = "Noch nicht – überleg nochmal.";
      }else{
        settled = true;
        btn.classList.add("wrong");
        app.querySelectorAll(".choice").forEach((b,j)=>{ if(opts[j].correct) b.classList.add("correct"); });
        fb.className = "feedback no";
        fb.innerHTML = `Das war leider falsch.<div class="why">${q.why}</div>`;
        session.marks[session.idx] = "miss";
        session.wrong++;
        noteResult(q.key, false);
        setTimeout(next, 3200);
      }
    };
  });
}

function next(){
  session.idx++;
  if(session.idx >= session.qs.length) renderSummary();
  else renderQuestion();
}

function renderSummary(){
  const total = session.qs.length;
  const firstTry = session.marks.filter(m=>m==="done").length;
  const pct = Math.round(firstTry/total*100);
  const stars = pct>=95?5:pct>=85?4:pct>=70?3:pct>=50?2:pct>0?1:0;
  const titel = session.mode==="exam"
    ? (pct>=80 ? "Bestanden! 🏅" : "Fast – übt das nochmal")
    : "Übung geschafft!";
  app.innerHTML = `
    ${header()}
    <div class="card" style="margin-top:20px;">
      <div style="font-size:42px;">${pct>=80?"🏅":"💪"}</div>
      <h3 style="color:var(--ink);font-size:20px;margin:8px 0 2px;">${titel}</h3>
      ${starsRow(stars)}
      <div class="result-line">${firstTry} von ${total} auf Anhieb richtig</div>
      ${session.mode==="exam" && pct<80 ? `<div class="why" style="margin-top:10px;">Bei der echten Prüfung solltest du fast alles richtig haben – üb die schwierigen Bereiche nochmal einzeln.</div>` : ``}
      <div class="btn-row">
        <button class="btn btn-primary" id="again">Nochmal üben</button>
        <button class="btn btn-ghost" id="home">Zur Übersicht</button>
      </div>
    </div>`;
  app.querySelector("#again").onclick = ()=>startSession(session.mode, session.cat);
  app.querySelector("#home").onclick = renderStart;
}

renderStart();
})();
</script>
