<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fahrrad-Führerschein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --paper:#FCFBF8; --paper-deep:#F3EFE6; --paper-edge:#DDD6C8;
  --ink:#1B1A1E; --ink-soft:#6E6A63;
  --ocean:#3D6BD6; --ocean-deep:#2C51AC;
  --coral:#8B6FC4; --coral-deep:#6B51A3;
  --gold:#A98FD6;
  --sage:#3F8A5C; --sage-bg:#E6F2E9;
  --berry:#C2506B; --berry-bg:#FAE9ED;
  --road:#C9C6BE; --grass:#EAEFE4;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#131316; --paper-deep:#1D1C22; --paper-edge:#312F39;
    --ink:#F3EFE7; --ink-soft:#A9A49B;
    --ocean:#7FA3F5; --ocean-deep:#A9C1FF;
    --coral:#B79AE8; --coral-deep:#CFB9F7;
    --gold:#C6ABF3;
    --sage:#6FCB93; --sage-bg:#1D3126;
    --berry:#E98BA4; --berry-bg:#35222A;
    --road:#3A3841; --grass:#22262133;
  }
}
*{box-sizing:border-box;}
body{
  margin:0;min-height:100vh;
  background:
    radial-gradient(circle at 16% 6%, hsl(263 55% 62% / .11), transparent 42%),
    radial-gradient(circle at 88% 84%, hsl(222 70% 58% / .09), transparent 46%),
    var(--paper);
  color:var(--ink);
  font-family:"Atkinson Hyperlegible","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Baloo 2",sans-serif;text-wrap:balance;}
button{font-family:inherit;}
#app{max-width:800px;margin:0 auto;padding:22px 18px 70px;}

/* Kopf und Zurück */
.top{display:flex;align-items:center;gap:14px;margin-bottom:8px;}
.top .badge{font-size:38px;line-height:1;}
.top h1{font-size:26px;font-weight:800;margin:0;color:var(--ocean-deep);}
.top p{margin:2px 0 0;color:var(--ink-soft);font-size:13.5px;}
.back{
  display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;background:var(--paper-deep);
  border:2px solid var(--paper-edge);border-radius:999px;padding:8px 16px;
  color:var(--ocean-deep);font-size:13.5px;font-weight:700;text-decoration:none;cursor:pointer;
}
.back:hover{border-color:var(--ocean);}
.profil{
  display:flex;align-items:center;gap:8px;background:var(--paper-deep);border:2px solid var(--paper-edge);
  border-radius:999px;padding:6px 14px 6px 6px;font-weight:700;font-size:13.5px;color:var(--ink);cursor:pointer;flex:none;
}
.profil:hover{border-color:var(--coral);}
.profil .dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;}

/* Profilauswahl */
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;}
.picker-card{
  display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--paper-deep);
  border:2px solid var(--paper-edge);border-radius:20px;padding:22px 16px;cursor:pointer;color:var(--ink);
  transition:transform .12s ease,border-color .12s ease;
}
.picker-card:hover{transform:translateY(-3px);border-color:var(--coral);}
.picker-card .avatar{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Baloo 2",sans-serif;font-size:26px;font-weight:800;}
.picker-card .nm{font-family:"Baloo 2",sans-serif;font-size:17px;font-weight:700;}
.hinweis{font-size:13px;color:var(--ink-soft);margin-top:20px;line-height:1.6;}

/* Startkacheln */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:22px;}
.mode{
  display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--paper-deep);
  border:2px solid var(--paper-edge);border-radius:18px;padding:18px 16px;cursor:pointer;color:var(--ink);
  transition:transform .12s ease,border-color .12s ease;
}
.mode:hover{transform:translateY(-3px);border-color:var(--coral);}
.mode .ic{font-size:29px;line-height:1;flex:none;}
.mode h3{margin:0 0 3px;font-size:16.5px;}
.mode .sub{font-size:12.5px;color:var(--ink-soft);}
.mode.exam{border-color:var(--coral);background:hsl(263 60% 62% / .1);}

/* Fragen */
.card{background:var(--paper-deep);border:2px solid var(--paper-edge);border-radius:20px;padding:22px 20px;text-align:center;}
.card h3{font-size:16px;color:var(--ink-soft);margin:0 0 14px;font-weight:700;}
.sign-wrap{display:flex;justify-content:center;margin:4px 0 16px;}
img.sign{display:block;width:112px;height:auto;}
img.sign.big{width:150px;}
img.choice-img{width:86px;}
.scene{display:flex;justify-content:center;margin:4px 0 14px;}
.scene svg{width:100%;max-width:300px;height:auto;}
.qtext{font-size:18px;line-height:1.5;margin:6px 0 14px;}
.choices{display:grid;gap:10px;}
.choices.two{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.choice{
  padding:14px 12px;border-radius:14px;border:2px solid var(--paper-edge);background:var(--paper);
  font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);text-align:center;
}
.choice:hover:not(:disabled){border-color:var(--ocean);}
.choice.correct{background:var(--sage-bg);border-color:var(--sage);color:var(--sage);}
.choice.wrong{background:var(--berry-bg);border-color:var(--berry);color:var(--berry);}
.choice.sign-choice{padding:10px;display:flex;justify-content:center;}
.feedback{margin-top:14px;font-weight:700;min-height:22px;}
.feedback.ok{color:var(--sage);}
.feedback.no{color:var(--berry);}
.why{margin-top:8px;font-weight:400;font-size:14px;color:var(--ink-soft);line-height:1.6;}

.progressdots{display:flex;gap:5px;margin-bottom:18px;}
.progressdots i{flex:1;height:7px;border-radius:4px;background:var(--paper-edge);}
.progressdots i.done{background:var(--sage);}
.progressdots i.now{background:var(--gold);}
.progressdots i.miss{background:var(--berry);}

.btn{border:none;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14.5px;cursor:pointer;}
.btn-primary{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-deep);}
.btn-primary:active{transform:translateY(3px);box-shadow:none;}
.btn-ghost{background:transparent;color:var(--ocean-deep);border:2px solid var(--paper-edge);}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px;}

.stars{display:flex;justify-content:center;gap:4px;margin:12px 0;}
.stars svg{width:26px;height:26px;}
.result-line{font-size:16px;color:var(--ink-soft);}
.stat{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);margin-top:16px;}
.stat .bar{flex:1;height:10px;border-radius:5px;background:var(--paper-deep);overflow:hidden;}
.stat .bar i{display:block;height:100%;background:var(--ocean);}

.sheet{margin-top:26px;background:var(--paper-deep);border:1px solid var(--paper-edge);border-radius:16px;padding:16px 18px;}
.sheet h3{margin:0 0 10px;font-size:16px;}
.sheet ul{margin:0;padding-left:20px;line-height:1.8;font-size:14.5px;}

.gruppe{font-size:15px;margin:26px 0 2px;color:var(--ink-soft);}
.sign-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px;margin-top:14px;}
.sign-gallery figure{margin:0;text-align:center;}
.sign-gallery figcaption{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.45;}
.sign-gallery figcaption b{color:var(--ink);font-size:13px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;}}
</style>
</head>
<body>
<div id="app"></div>

  "arbeitsstelle": {nr:30, gruppe:"ergaenzung", name:"Arbeitsstelle", datei:"30-arbeitsstelle.png", meaning:"Baustelle – besonders vorsichtig fahren, oft liegt Sand oder Schotter auf der Straße."},

  "beginn-einer-fussgaengerzone": {nr:33, gruppe:"ergaenzung", name:"Beginn einer Fußgängerzone", datei:"33-beginn-einer-fussgaengerzone.png", meaning:"Fußgängerzone: Hier gehören die Straße den Fußgängern. Mit dem Rad schieben."},

  "gruenpfeilschild-an-der-ampel": {nr:36, gruppe:"ergaenzung", name:"Grünpfeilschild an der Ampel", datei:"36-gruenpfeilschild-an-der-ampel.png", meaning:"Bei Rot darfst du rechts abbiegen – aber erst anhalten und schauen, ob frei ist."},
  "gruenpfeilschild-nur-fuer-den-radverkehr": {nr:37, gruppe:"ergaenzung", name:"Grünpfeilschild nur für den Radverkehr", datei:"37-gruenpfeilschild-nur-fuer-den-radverkehr.png", meaning:"Das gilt nur für Radfahrer: bei Rot rechts abbiegen, nach dem Anhalten und wenn frei."},

const SIGN_GRUPPEN = {kern:"Kernwissen", ergaenzung:"Weitere Zeichen und Markierungen", ampel:"Ampelwissen"};
(function(){
"use strict";

/* ============================================================
   Profile – geteilt mit der Englisch-App (gleiche Adresse,
   deshalb liegt beides im selben localStorage).
   ============================================================ */
const STANDARD_PROFILE = [
  {id:"kid-ellena", name:"Ellena", color:"#8B6FC4"},
  {id:"kid-merle",  name:"Merle",  color:"#3D6BD6"},
  {id:"kid-eltern", name:"Eltern", color:"#4A4750", role:"parent"}
];
function ladeProfile(){
  try{
    const roh = JSON.parse(localStorage.getItem("wex:kids") || "[]");
    if(Array.isArray(roh) && roh.length) return roh;
  }catch(e){}
  return STANDARD_PROFILE;
}
function aktuellesProfil(){
  let id = null;
  try{ id = localStorage.getItem("wex:currentKid"); }catch(e){}
  const profile = ladeProfile();
  return profile.find(p=>p.id===id) || null;
}
function waehleProfil(id){
  try{ localStorage.setItem("wex:currentKid", id); }catch(e){}
}

/* ============================================================
   Fortschritt – pro Kind getrennt
   ============================================================ */
function statsKey(){
  const p = aktuellesProfil();
  return "rad:stats:" + (p ? p.id : "gast");
}
function loadStats(){
  try{ return JSON.parse(localStorage.getItem(statsKey()) || "{}"); }catch(e){ return {}; }
}
function saveStats(s){ try{ localStorage.setItem(statsKey(), JSON.stringify(s)); }catch(e){} }
function noteResult(key, correct){
  const s = loadStats();
  const e = s[key] || {c:0, w:0};
  if(correct) e.c++; else e.w++;
  s[key] = e; saveStats(s);
}
function masteryPct(keys){
  const s = loadStats();
  let done = 0;
  keys.forEach(k=>{ if(s[k] && s[k].c > 0) done++; });
  return keys.length ? Math.round(done/keys.length*100) : 0;
}

/* ============================================================
   Schilderbilder
   ============================================================ */
const SIGN_IDS = Object.keys(SIGNS);
function signImg(id, klasse){
  const s = SIGNS[id];
  return `<img class="${klasse||"sign"}" src="schilder/${s.datei}" alt="${s.name}" loading="lazy">`;
}
function signHref(id){ return "schilder/" + SIGNS[id].datei; }

/* ============================================================
   Kreuzungsbilder für die Vorfahrtsfragen
   ============================================================ */
const POS = {
  unten: {x:112, y:210, rot:0},
  oben:  {x:88,  y:30,  rot:180},
  rechts:{x:210, y:88,  rot:270},
  links: {x:30,  y:112, rot:90}
};
function bikeMarker(x, y, rot){
  return `<g transform="translate(${x},${y}) rotate(${rot})">
    <circle cx="0" cy="0" r="13" fill="#3D6BD6"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold" transform="rotate(${-rot})">DU</text>
  </g>`;
}
function carMarker(x, y, rot, color, label){
  return `<g transform="translate(${x},${y}) rotate(${rot})">
    <rect x="-11" y="-15" width="22" height="30" rx="5" fill="${color}"/>
    <rect x="-8" y="-9" width="16" height="9" rx="2" fill="#ffffff" opacity=".65"/>
    ${label ? `<text x="0" y="9" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" transform="rotate(${-rot})">${label}</text>` : ``}
  </g>`;
}
function crossingSvg(cfg){
  const others = (cfg.others||[]).map(o=>{
    const p = POS[o.from];
    return carMarker(p.x, p.y, p.rot, o.color||"#C2506B", o.label||"");
  }).join("");
  const you = POS.unten;
  const signs = (cfg.signs||[]).map(s=>{
    const map = {unten:{x:150,y:168}, oben:{x:48,y:26}, rechts:{x:170,y:48}, links:{x:26,y:150}};
    const p = map[s.at] || map.unten;
    return `<image href="${signHref(s.id)}" x="${p.x-17}" y="${p.y-17}" width="34" height="34"/>`;
  }).join("");
  const arrows = cfg.arrow ? `<path d="${cfg.arrow}" stroke="#3D6BD6" stroke-width="3" fill="none" stroke-dasharray="6 5" marker-end="url(#ah)"/>` : ``;
  return `<svg viewBox="0 0 240 240" role="img" aria-label="Kreuzung">
    <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#3D6BD6"/></marker></defs>
    <rect width="240" height="240" fill="var(--grass)"/>
    <rect x="72" y="0" width="96" height="240" fill="var(--road)"/>
    <rect x="0" y="72" width="240" height="96" fill="var(--road)"/>
    <g stroke="#ffffff" stroke-width="3" stroke-dasharray="10 10" opacity=".75">
      <line x1="120" y1="0" x2="120" y2="72"/><line x1="120" y1="168" x2="120" y2="240"/>
      <line x1="0" y1="120" x2="72" y2="120"/><line x1="168" y1="120" x2="240" y2="120"/>
    </g>
    ${arrows}${others}${bikeMarker(you.x, you.y, you.rot)}${signs}
  </svg>`;
}

/* ============================================================
   Fragen zu den Schildern
   ============================================================ */
function signQuestions(gruppe){
  const ids = gruppe ? SIGN_IDS.filter(id=>SIGNS[id].gruppe===gruppe) : SIGN_IDS;
  const pool = ids.length >= 4 ? ids : SIGN_IDS;
  const qs = [];
  ids.forEach(id=>{
    const falsch = pool.filter(x=>x!==id).sort(()=>Math.random()-0.5).slice(0,3);
    qs.push({
      key:"sign-mean-"+id,
      head:"Was bedeutet dieses Schild?",
      visual:`<div class="sign-wrap">${signImg(id, "sign big")}</div>`,
      options: [id, ...falsch].sort(()=>Math.random()-0.5).map(o=>({label:SIGNS[o].name, correct:o===id})),
      why: SIGNS[id].meaning
    });
    const falsch2 = pool.filter(x=>x!==id).sort(()=>Math.random()-0.5).slice(0,3);
    qs.push({
      key:"sign-find-"+id,
      head:"Welches Schild ist das?",
      question: SIGNS[id].name,
      options: [id, ...falsch2].sort(()=>Math.random()-0.5).map(o=>({html:signImg(o, "sign choice-img"), correct:o===id, signOption:true})),
      why: SIGNS[id].meaning
    });
  });
  return qs;
}

function pickQuestions(mode, gruppe){
  const shuffle = a => a.slice().sort(()=>Math.random()-0.5);
  if(mode==="signs") return shuffle(signQuestions(gruppe)).slice(0, 12);
  if(mode==="row") return shuffle(RIGHT_OF_WAY);
  if(mode==="rules") return shuffle(RULES);
  return shuffle(shuffle(signQuestions("kern")).slice(0,7)
    .concat(shuffle(RIGHT_OF_WAY).slice(0,5))
    .concat(shuffle(RULES).slice(0,3)));
}

function startSession(mode, gruppe){
  session = {mode, gruppe, qs: pickQuestions(mode, gruppe), idx:0, marks:[]};
  renderQuestion();
}

function renderQuestion(){
  const q = session.qs[session.idx];
  const opts = q.options.slice().sort(()=>Math.random()-0.5);
  const zweiSpalten = opts.every(o=>o.signOption) || opts.length<=3;
  app.innerHTML = `
    ${zurueck("Übung beenden", renderStart)}
    <div class="progressdots">
      ${session.qs.map((_,i)=>`<i class="${session.marks[i]||(i===session.idx?'now':'')}"></i>`).join("")}
    </div>
    <div class="card">
      <h3>${q.head}</h3>
      ${q.visual ? (q.visual.startsWith("<div") ? q.visual : `<div class="scene">${q.visual}</div>`) : ``}
      ${q.question ? `<div class="qtext">${q.question}</div>` : ``}
      <div class="choices ${zweiSpalten?'two':''}">
        ${opts.map((o,i)=>`<button class="choice ${o.signOption?'sign-choice':''}" data-i="${i}">${o.html || o.label}</button>`).join("")}
      </div>
      <div class="feedback" id="fb"></div>
    </div>`;
  const fb = app.querySelector("#fb");
  let versuche = 0, fertig = false;
  app.querySelectorAll(".choice").forEach((btn,i)=>{
    btn.onclick = ()=>{
      if(fertig || btn.classList.contains("wrong")) return;
      const o = opts[i];
      versuche++;
      if(o.correct){
        fertig = true;
        btn.classList.add("correct");
        fb.className = "feedback ok";
        fb.innerHTML = (versuche===1 ? "Richtig! 🎉" : "Richtig!") + `<div class="why">${q.why}</div>`;
        session.marks[session.idx] = versuche===1 ? "done" : "miss";
        noteResult(q.key, versuche===1);
        setTimeout(next, versuche===1 ? 1900 : 2600);
      }else if(versuche<2){
        btn.classList.add("wrong");
        btn.disabled = true;
        fb.className = "feedback no";
        fb.textContent = "Noch nicht – überleg nochmal.";
      }else{
        fertig = true;
        btn.classList.add("wrong");
        app.querySelectorAll(".choice").forEach((b,j)=>{ if(opts[j].correct) b.classList.add("correct"); });
        fb.className = "feedback no";
        fb.innerHTML = `Das war leider falsch.<div class="why">${q.why}</div>`;
        session.marks[session.idx] = "miss";
        noteResult(q.key, false);
        setTimeout(next, 3200);
      }
    };
  });
}

function next(){
  session.idx++;
  if(session.idx >= session.qs.length) renderSummary();
  else renderQuestion();
}

function renderSummary(){
  const total = session.qs.length;
  const ersterVersuch = session.marks.filter(m=>m==="done").length;
  const pct = Math.round(ersterVersuch/total*100);
  const sterne = pct>=95?5:pct>=85?4:pct>=70?3:pct>=50?2:pct>0?1:0;
  const titel = session.mode==="exam"
    ? (pct>=80 ? "Bestanden! 🏅" : "Fast – übt das nochmal")
    : "Übung geschafft!";
  app.innerHTML = `
    ${zurueck("Zurück zur Übersicht", renderStart)}
    ${kopf()}
    <div class="card" style="margin-top:20px;">
      <div style="font-size:42px;">${pct>=80?"🏅":"💪"}</div>
      <h3 style="color:var(--ink);font-size:20px;margin:8px 0 2px;">${titel}</h3>
      ${starsRow(sterne)}
      <div class="result-line">${ersterVersuch} von ${total} auf Anhieb richtig</div>
      ${session.mode==="exam" && pct<80 ? `<div class="why" style="margin-top:10px;">Bei der echten Prüfung solltest du fast alles richtig haben – üb die schwierigen Bereiche nochmal einzeln.</div>` : ``}
      <div class="btn-row">
        <button class="btn btn-primary" id="again">Nochmal üben</button>
        <button class="btn btn-ghost" id="home">Zur Übersicht</button>
      </div>
    </div>`;
  app.querySelector("#again").onclick = ()=>startSession(session.mode, session.gruppe);
  app.querySelector("#home").onclick = renderStart;
}

renderStart();
})();
</script>
</body>
</html>
