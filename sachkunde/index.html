<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fahrrad-Führerschein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --paper:#FCFBF8; --paper-deep:#F3EFE6; --paper-edge:#DDD6C8;
  --ink:#1B1A1E; --ink-soft:#6E6A63;
  --ocean:#3D6BD6; --ocean-deep:#2C51AC;
  --coral:#8B6FC4; --coral-deep:#6B51A3;
  --gold:#A98FD6;
  --sage:#3F8A5C; --sage-bg:#E6F2E9;
  --berry:#C2506B; --berry-bg:#FAE9ED;
  --road:#C9C6BE; --grass:#EAEFE4;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#131316; --paper-deep:#1D1C22; --paper-edge:#312F39;
    --ink:#F3EFE7; --ink-soft:#A9A49B;
    --ocean:#7FA3F5; --ocean-deep:#A9C1FF;
    --coral:#B79AE8; --coral-deep:#CFB9F7;
    --gold:#C6ABF3;
    --sage:#6FCB93; --sage-bg:#1D3126;
    --berry:#E98BA4; --berry-bg:#35222A;
    --road:#3A3841; --grass:#22262133;
  }
}
*{box-sizing:border-box;}
body{
  margin:0;min-height:100vh;
  background:
    radial-gradient(circle at 16% 6%, hsl(263 55% 62% / .11), transparent 42%),
    radial-gradient(circle at 88% 84%, hsl(222 70% 58% / .09), transparent 46%),
    var(--paper);
  color:var(--ink);
  font-family:"Atkinson Hyperlegible","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Baloo 2",sans-serif;text-wrap:balance;}
button{font-family:inherit;}
#app{max-width:760px;margin:0 auto;padding:24px 18px 70px;}

.top{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.top .badge{font-size:40px;line-height:1;}
.top h1{font-size:27px;font-weight:800;margin:0;color:var(--ocean-deep);}
.top p{margin:2px 0 0;color:var(--ink-soft);font-size:14px;}
.back{display:inline-block;margin-bottom:18px;color:var(--ocean-deep);font-size:13.5px;text-decoration:none;}
.back:hover{text-decoration:underline;}

.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:24px;}
.mode{
  display:flex;gap:14px;align-items:flex-start;text-align:left;
  background:var(--paper-deep);border:2px solid var(--paper-edge);border-radius:18px;
  padding:18px 16px;cursor:pointer;color:var(--ink);
  transition:transform .12s ease,border-color .12s ease;
}
.mode:hover{transform:translateY(-3px);border-color:var(--coral);}
.mode .ic{font-size:30px;line-height:1;flex:none;}
.mode h3{margin:0 0 3px;font-size:17px;}
.mode .sub{font-size:12.5px;color:var(--ink-soft);}
.mode.exam{border-color:var(--coral);background:hsl(263 60% 62% / .1);}

.card{background:var(--paper-deep);border:2px solid var(--paper-edge);border-radius:20px;padding:22px 20px;text-align:center;}
.card h3{font-size:16px;color:var(--ink-soft);margin:0 0 14px;font-weight:700;}
.sign-wrap{display:flex;justify-content:center;margin:4px 0 16px;}
.sign-wrap svg{width:130px;height:130px;}
.scene{display:flex;justify-content:center;margin:4px 0 14px;}
.scene svg{width:100%;max-width:300px;height:auto;}
.qtext{font-size:18px;line-height:1.5;margin:6px 0 14px;}
.choices{display:grid;gap:10px;}
.choices.two{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.choice{
  padding:14px 12px;border-radius:14px;border:2px solid var(--paper-edge);background:var(--paper);
  font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);text-align:center;
}
.choice:hover:not(:disabled){border-color:var(--ocean);}
.choice.correct{background:var(--sage-bg);border-color:var(--sage);color:var(--sage);}
.choice.wrong{background:var(--berry-bg);border-color:var(--berry);color:var(--berry);}
.choice.sign{padding:8px;}
.choice.sign svg{width:78px;height:78px;}
.feedback{margin-top:14px;font-weight:700;min-height:22px;}
.feedback.ok{color:var(--sage);}
.feedback.no{color:var(--berry);}
.why{margin-top:8px;font-weight:400;font-size:14px;color:var(--ink-soft);line-height:1.6;}

.progressdots{display:flex;gap:5px;margin-bottom:18px;}
.progressdots i{flex:1;height:7px;border-radius:4px;background:var(--paper-edge);}
.progressdots i.done{background:var(--sage);}
.progressdots i.now{background:var(--gold);}
.progressdots i.miss{background:var(--berry);}

.btn{border:none;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
.btn-primary{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-deep);}
.btn-primary:active{transform:translateY(3px);box-shadow:none;}
.btn-ghost{background:transparent;color:var(--ocean-deep);border:2px solid var(--paper-edge);}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px;}

.stars{display:flex;justify-content:center;gap:4px;margin:12px 0;}
.stars svg{width:26px;height:26px;}
.result-line{font-size:16px;color:var(--ink-soft);}
.stat{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);margin-top:14px;}
.stat .bar{flex:1;height:10px;border-radius:5px;background:var(--paper-deep);overflow:hidden;}
.stat .bar i{display:block;height:100%;background:var(--ocean);}

.sheet{margin-top:26px;background:var(--paper-deep);border:1px solid var(--paper-edge);border-radius:16px;padding:16px 18px;}
.sheet h3{margin:0 0 10px;font-size:16px;}
.sheet ul{margin:0;padding-left:20px;line-height:1.8;font-size:14.5px;}
.sign-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;margin-top:16px;}
.sign-gallery figure{margin:0;text-align:center;}
.sign-gallery svg{width:84px;height:84px;}
.sign-gallery figcaption{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.4;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ============================================================
   Verkehrszeichen – nach den amtlichen Vorlagen gezeichnet
   Farben: Verkehrsrot RAL 3020, Verkehrsblau RAL 5017,
   Verkehrsgelb RAL 1023, Schwarz, Weiß
   ============================================================ */
const C = {red:"#CC0605", blue:"#0B4EA2", yellow:"#F6C400", black:"#1A1A18", white:"#FFFFFF"};

/* Grundformen der Schilder */
function discSign(fill, inner){
  return `<circle cx="50" cy="50" r="46" fill="${fill}"/>${inner||""}`;
}
function ringSign(inner){
  return `<circle cx="50" cy="50" r="46" fill="${C.white}"/>
    <circle cx="50" cy="50" r="38.5" fill="none" stroke="${C.red}" stroke-width="15"/>${inner||""}`;
}
function triangleUp(inner){
  return `<path d="M50 5 L97 87 A6 6 0 0 1 92 95 L8 95 A6 6 0 0 1 3 87 Z"
      fill="${C.white}" stroke="${C.red}" stroke-width="10" stroke-linejoin="round"/>${inner||""}`;
}
function squareSign(fill, inner){
  return `<rect x="4" y="4" width="92" height="92" rx="6" fill="${fill}"/>${inner||""}`;
}

/* Piktogramme */
function bikePicto(color, x, y, s){
  return `<g transform="translate(${x},${y}) scale(${s})" stroke="${color}" stroke-width="3.2"
      fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-14" cy="7" r="9.5"/><circle cx="14" cy="7" r="9.5"/>
    <path d="M-14 7 L-5 -7 L9 -7 L14 7"/><path d="M-5 -7 L1 7"/>
    <path d="M-8 -11 L-2 -11"/><path d="M7 -12 L15 -12"/><path d="M9 -7 L12 -11"/>
  </g>`;
}
function personPicto(color, x, y, s){
  return `<g transform="translate(${x},${y}) scale(${s})" fill="${color}">
    <circle cx="0" cy="-14.5" r="4.6"/>
    <path d="M-1.5 -9.5 L-6.5 2 L-3.4 3.2 L0 -3.4 L3.4 3.2 L6.5 2 Z"/>
    <path d="M-4.2 3 L-6.5 14.5 L-3.2 15.2 L0 5.2 L3.2 15.2 L6.5 14.5 L4.2 3 Z"/>
  </g>`;
}
function childrenPicto(color){
  return `<g fill="${color}">
    <g transform="translate(38,62) scale(0.92)">
      <circle cx="0" cy="-14.5" r="4.6"/>
      <path d="M-2 -9.5 L-7 1 L-4 2.4 L0 -3 L4 2.4 L7 1 L2 -9.5 Z"/>
      <path d="M-4 2.4 L-7 14 L-3.6 14.8 L0 5 L3.6 14.8 L7 14 L4 2.4 Z"/>
    </g>
    <g transform="translate(62,66) scale(0.7)">
      <circle cx="0" cy="-14.5" r="4.8"/>
      <path d="M-2 -9.5 L-8 0 L-5 2 L0 -3 L5 2 L8 0 L2 -9.5 Z"/>
      <path d="M-4 2 L-7 14 L-3.6 14.8 L0 5 L3.6 14.8 L7 14 L4 2 Z"/>
    </g>
  </g>`;
}
function arrowUp(color, x, y, w, h){
  const half = w/2, headW = w*1.9, headH = h*0.42;
  return `<path d="M${x-half} ${y+h/2} L${x-half} ${y-h/2+headH} L${x-headW/2} ${y-h/2+headH}
    L${x} ${y-h/2} L${x+headW/2} ${y-h/2+headH} L${x+half} ${y-h/2+headH} L${x+half} ${y+h/2} Z" fill="${color}"/>`;
}
function arrowDown(color, x, y, w, h){
  const half = w/2, headW = w*1.9, headH = h*0.42;
  return `<path d="M${x-half} ${y-h/2} L${x-half} ${y+h/2-headH} L${x-headW/2} ${y+h/2-headH}
    L${x} ${y+h/2} L${x+headW/2} ${y+h/2-headH} L${x+half} ${y+h/2-headH} L${x+half} ${y-h/2} Z" fill="${color}"/>`;
}

const SIGNS = {
  /* ---------- Vorfahrt ---------- */
  "vorfahrt-gewaehren": {
    cat:"vorfahrt", nr:"205", name:"Vorfahrt gewähren",
    meaning:"Du musst warten und die anderen zuerst fahren lassen.",
    svg:`<path d="M8 8 L92 8 A6 6 0 0 1 97 17 L55 92 A6 6 0 0 1 45 92 L3 17 A6 6 0 0 1 8 8 Z"
      fill="${C.white}" stroke="${C.red}" stroke-width="11" stroke-linejoin="round"/>`
  },
  "stop": {
    cat:"vorfahrt", nr:"206", name:"Stop – Vorfahrt gewähren",
    meaning:"Immer anhalten, schauen, dann erst weiterfahren.",
    svg:`<polygon points="31,3 69,3 97,31 97,69 69,97 31,97 3,69 3,31" fill="${C.red}"/>
      <polygon points="33,9 67,9 91,33 91,67 67,91 33,91 9,67 9,33" fill="none" stroke="${C.white}" stroke-width="5"/>
      <text x="50" y="61" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-size="26" font-weight="bold" fill="${C.white}" letter-spacing="1">STOP</text>`
  },
  "vorfahrtstrasse": {
    cat:"vorfahrt", nr:"306", name:"Vorfahrtstraße",
    meaning:"Du hast Vorfahrt – die anderen müssen warten.",
    svg:`<path d="M50 3 L97 50 L50 97 L3 50 Z" fill="${C.white}"/>
      <path d="M50 17 L83 50 L50 83 L17 50 Z" fill="${C.yellow}"/>`
  },
  "vorfahrtstrasse-ende": {
    cat:"vorfahrt", nr:"307", name:"Ende der Vorfahrtstraße",
    meaning:"Ab hier hast du keine Vorfahrt mehr – jetzt gilt wieder rechts vor links.",
    svg:`<defs><clipPath id="raute"><path d="M50 17 L83 50 L50 83 L17 50 Z"/></clipPath></defs>
      <path d="M50 3 L97 50 L50 97 L3 50 Z" fill="${C.white}"/>
      <path d="M50 17 L83 50 L50 83 L17 50 Z" fill="${C.yellow}"/>
      <g clip-path="url(#raute)" stroke="#4A463F" stroke-width="2.6">
        <line x1="10" y1="46" x2="90" y2="26"/><line x1="10" y1="56" x2="90" y2="36"/>
        <line x1="10" y1="66" x2="90" y2="46"/><line x1="10" y1="76" x2="90" y2="56"/>
      </g>`
  },
  "vorfahrt-kreuzung": {
    cat:"vorfahrt", nr:"301", name:"Vorfahrt an der nächsten Kreuzung",
    meaning:"An der nächsten Kreuzung hast du Vorfahrt.",
    svg:triangleUp(`<rect x="44" y="30" width="12" height="46" fill="${C.black}"/>
      <rect x="24" y="47" width="52" height="6" fill="${C.black}"/>`)
  },
  "kreuzung-rechts": {
    cat:"vorfahrt", nr:"102", name:"Kreuzung: rechts vor links",
    meaning:"Achtung Kreuzung ohne Vorfahrtschilder – hier gilt rechts vor links.",
    svg:triangleUp(`<rect x="46.5" y="30" width="7" height="46" fill="${C.black}"/>
      <rect x="24" y="49.5" width="52" height="7" fill="${C.black}"/>`)
  },
  "gegenverkehr-vorrang": {
    cat:"vorfahrt", nr:"208", name:"Dem Gegenverkehr Vorrang gewähren",
    meaning:"Die Straße wird eng. Du musst warten – der Gegenverkehr darf zuerst.",
    svg:ringSign(`${arrowDown(C.red, 40, 50, 11, 46)}${arrowUp(C.black, 62, 50, 6, 42)}`)
  },
  "vorrang-gegenverkehr": {
    cat:"vorfahrt", nr:"308", name:"Vorrang vor dem Gegenverkehr",
    meaning:"Die Straße wird eng, aber du darfst zuerst – der Gegenverkehr wartet.",
    svg:squareSign(C.blue, `${arrowUp(C.white, 40, 50, 12, 52)}${arrowDown(C.red, 64, 50, 7, 42)}`)
  },
  "kreisverkehr": {
    cat:"vorfahrt", nr:"215", name:"Kreisverkehr",
    meaning:"Wer schon im Kreis fährt, hat Vorfahrt. Beim Rausfahren Handzeichen geben.",
    svg:discSign(C.blue, `
      <g fill="none" stroke="${C.white}" stroke-width="7">
        <path d="M72.5 37 A26 26 0 0 0 47.5 24.3"/>
        <path d="M27.5 37 A26 26 0 0 0 30.1 66.7"/>
        <path d="M50 76 A26 26 0 0 0 73.4 59.9"/>
      </g>
      <g fill="${C.white}">
        <g transform="translate(45.5,24.4) rotate(170)"><polygon points="0,-6 11,0 0,6"/></g>
        <g transform="translate(30.1,66.7) rotate(50)"><polygon points="0,-6 11,0 0,6"/></g>
        <g transform="translate(74.4,58.9) rotate(-70)"><polygon points="0,-6 11,0 0,6"/></g>
      </g>`)
  },

  /* ---------- Verbote ---------- */
  "fahrverbot": {
    cat:"verbot", nr:"250", name:"Verbot für Fahrzeuge aller Art",
    meaning:"Hier darf niemand hineinfahren – auch du nicht mit dem Fahrrad. Schieben ist erlaubt.",
    svg:ringSign()
  },
  "einfahrt-verboten": {
    cat:"verbot", nr:"267", name:"Verbot der Einfahrt",
    meaning:"Hier darfst du nicht hineinfahren – meist eine Einbahnstraße von vorn.",
    svg:discSign(C.red, `<rect x="17" y="43" width="66" height="14" rx="2" fill="${C.white}"/>`)
  },
  "fahrrad-verboten": {
    cat:"verbot", nr:"254", name:"Verbot für Radfahrer",
    meaning:"Hier darfst du nicht mit dem Fahrrad fahren – absteigen und schieben.",
    svg:ringSign(bikePicto(C.black, 50, 50, 1.15))
  },

  /* ---------- Wege für Rad und Fuß ---------- */
  "radweg": {
    cat:"gebot", nr:"237", name:"Radweg",
    meaning:"Dieser Weg ist für Radfahrer – hier musst du fahren, nicht auf der Straße.",
    svg:discSign(C.blue, bikePicto(C.white, 50, 50, 1.55))
  },
  "gehweg": {
    cat:"gebot", nr:"239", name:"Gehweg",
    meaning:"Nur für Fußgänger. Dein Fahrrad musst du hier schieben.",
    svg:discSign(C.blue, personPicto(C.white, 50, 50, 1.9))
  },
  "geh-radweg": {
    cat:"gebot", nr:"240", name:"Gemeinsamer Geh- und Radweg",
    meaning:"Fußgänger und Radfahrer benutzen denselben Weg – nimm Rücksicht und fahr langsam.",
    svg:discSign(C.blue, `${bikePicto(C.white, 50, 27, 0.95)}
      <rect x="20" y="48" width="60" height="4" fill="${C.white}"/>
      ${personPicto(C.white, 50, 72, 1.15)}`)
  },
  "getrennt-rad-gehweg": {
    cat:"gebot", nr:"241", name:"Getrennter Rad- und Gehweg",
    meaning:"Links und rechts getrennt: Radfahrer auf die eine Seite, Fußgänger auf die andere.",
    svg:discSign(C.blue, `${bikePicto(C.white, 27, 50, 0.92)}
      <rect x="48" y="16" width="4" height="68" fill="${C.white}"/>
      ${personPicto(C.white, 73, 50, 1.15)}`)
  },
  "fahrtrichtung-rechts": {
    cat:"gebot", nr:"209", name:"Vorgeschriebene Fahrtrichtung rechts",
    meaning:"Hier musst du nach rechts fahren.",
    svg:discSign(C.blue, `<g transform="translate(50,50) rotate(90)">${arrowUp(C.white, 0, 0, 13, 52)}</g>`)
  },

  /* ---------- Gefahrzeichen ---------- */
  "achtung-kinder": {
    cat:"gefahr", nr:"136", name:"Achtung Kinder",
    meaning:"Hier spielen oft Kinder – langsam fahren und besonders aufpassen.",
    svg:triangleUp(childrenPicto(C.black))
  },
  "achtung-radfahrer": {
    cat:"gefahr", nr:"138", name:"Achtung Radverkehr",
    meaning:"Hier kreuzen Radfahrer – Autos müssen mit euch rechnen, trotzdem vorsichtig sein.",
    svg:triangleUp(bikePicto(C.black, 50, 62, 1.05))
  },
  "gefahrstelle": {
    cat:"gefahr", nr:"101", name:"Gefahrstelle",
    meaning:"Achtung, hier ist etwas Gefährliches – langsam fahren und schauen.",
    svg:triangleUp(`<rect x="45" y="36" width="10" height="32" rx="3" fill="${C.black}"/>
      <circle cx="50" cy="77" r="5.6" fill="${C.black}"/>`)
  },

  /* ---------- Hinweise ---------- */
  "einbahnstrasse": {
    cat:"hinweis", nr:"220", name:"Einbahnstraße",
    meaning:"Hier fahren alle nur in Pfeilrichtung. Von der anderen Seite darfst du nicht hinein.",
    svg:`<rect x="2" y="27" width="96" height="46" rx="5" fill="${C.blue}"/>
      <g transform="translate(50,50) rotate(90)">${arrowUp(C.white, 0, 0, 11, 62)}</g>`
  },
  "zebrastreifen": {
    cat:"hinweis", nr:"350", name:"Fußgängerüberweg (Zebrastreifen)",
    meaning:"Fußgänger haben Vorrang. Als Radfahrer absteigen und schieben.",
    svg:squareSign(C.blue, `
      <polygon points="50,22 84,84 16,84" fill="${C.white}"/>
      <g fill="${C.blue}">
        <rect x="21" y="76" width="58" height="4"/><rect x="27" y="67" width="46" height="4"/>
        <rect x="33" y="58" width="34" height="4"/><rect x="39" y="49" width="22" height="4"/>
      </g>
      ${personPicto(C.black, 50, 47, 1.0)}`)
  },
  "spielstrasse": {
    cat:"hinweis", nr:"325", name:"Verkehrsberuhigter Bereich (Spielstraße)",
    meaning:"Nur Schrittgeschwindigkeit. Kinder dürfen hier überall spielen.",
    svg:squareSign(C.blue, `
      <path d="M11 42 L24 29 L37 42 L37 60 L11 60 Z" fill="${C.white}"/>
      ${personPicto(C.white, 55, 38, 0.82)}
      <g transform="translate(69,44) scale(0.58)">${personPicto(C.white, 0, 0, 1)}</g>
      <circle cx="30" cy="72" r="5" fill="${C.white}"/>
      <g fill="${C.white}">
        <path d="M46 78 L50 68 L70 68 L76 78 Z"/>
        <circle cx="53" cy="80" r="4"/><circle cx="71" cy="80" r="4"/>
      </g>
      <rect x="11" y="87" width="78" height="4" fill="${C.white}"/>`)
  },
  "sackgasse": {
    cat:"hinweis", nr:"357", name:"Sackgasse",
    meaning:"Diese Straße hat keinen Ausgang – du musst wieder zurückfahren.",
    svg:`<rect x="4" y="4" width="92" height="92" rx="6" fill="${C.white}" stroke="#D9D3C6" stroke-width="2"/>
      <rect x="43" y="44" width="14" height="46" fill="${C.blue}"/>
      <rect x="20" y="22" width="60" height="14" fill="${C.blue}"/>`
  }
};
const SIGN_CATS = {
  vorfahrt:"Vorfahrt und Vorrang",
  verbot:"Verbote",
  gebot:"Wege für Rad und Fuß",
  gefahr:"Gefahrzeichen",
  hinweis:"Hinweise"
};

function signSvg(id){
  const s = SIGNS[id];
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${s.name}">${s.svg}</svg>`;
}

/* ============================================================
   Kreuzungs-Bilder für die Vorfahrtsfragen
   ============================================================ */
function bikeMarker(x, y, rot){
  return `<g transform="translate(${x},${y}) rotate(${rot})">
    <circle cx="0" cy="0" r="13" fill="#3D6BD6"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold" transform="rotate(${-rot})">DU</text>
  </g>`;
}
function carMarker(x, y, rot, color, label){
  return `<g transform="translate(${x},${y}) rotate(${rot})">
    <rect x="-11" y="-15" width="22" height="30" rx="5" fill="${color}"/>
    <rect x="-8" y="-9" width="16" height="9" rx="2" fill="#ffffff" opacity=".65"/>
    ${label ? `<text x="0" y="9" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" transform="rotate(${-rot})">${label}</text>` : ``}
  </g>`;
}
/* from: "unten" (du), "rechts", "links", "oben" */
const POS = {
  unten: {x:112, y:210, rot:0},
  oben:  {x:88,  y:30,  rot:180},
  rechts:{x:210, y:88,  rot:270},
  links: {x:30,  y:112, rot:90}
};
function crossingSvg(cfg){
  const others = (cfg.others||[]).map(o=>{
    const p = POS[o.from];
    return carMarker(p.x, p.y, p.rot, o.color||"#C2506B", o.label||"");
  }).join("");
  const you = POS.unten;
  const signs = (cfg.signs||[]).map(s=>{
    const map = {unten:{x:150,y:172}, oben:{x:50,y:28}, rechts:{x:172,y:50}, links:{x:28,y:150}};
    const p = map[s.at] || map.unten;
    return `<g transform="translate(${p.x - 13},${p.y - 13}) scale(0.26)">${SIGNS[s.id].svg}</g>`;
  }).join("");
  const arrows = cfg.arrow ? `<path d="${cfg.arrow}" stroke="#3D6BD6" stroke-width="3" fill="none" stroke-dasharray="6 5" marker-end="url(#ah)"/>` : ``;
  return `<svg viewBox="0 0 240 240" role="img" aria-label="Kreuzung">
    <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#3D6BD6"/></marker></defs>
    <rect width="240" height="240" fill="var(--grass)"/>
    <rect x="72" y="0" width="96" height="240" fill="var(--road)"/>
    <rect x="0" y="72" width="240" height="96" fill="var(--road)"/>
    <g stroke="#ffffff" stroke-width="3" stroke-dasharray="10 10" opacity=".75">
      <line x1="120" y1="0" x2="120" y2="72"/><line x1="120" y1="168" x2="120" y2="240"/>
      <line x1="0" y1="120" x2="72" y2="120"/><line x1="168" y1="120" x2="240" y2="120"/>
    </g>
    ${arrows}${others}${bikeMarker(you.x, you.y, you.rot)}${signs}
  </svg>`;
}

const SIGN_IDS = Object.keys(SIGNS);

function signQuestions(){
  const qs = [];
  SIGN_IDS.forEach(id=>{
    const wrong = SIGN_IDS.filter(x=>x!==id).sort(()=>Math.random()-0.5).slice(0,3);
    const opts = [id, ...wrong].sort(()=>Math.random()-0.5);
    qs.push({
      key:"sign-mean-"+id,
      head:"Was bedeutet dieses Schild?",
      visual:`<div class="sign-wrap">${signSvg(id)}</div>`,
      options: opts.map(o=>({label:SIGNS[o].name, correct:o===id})),
      why: SIGNS[id].meaning
    });
    const wrong2 = SIGN_IDS.filter(x=>x!==id).sort(()=>Math.random()-0.5).slice(0,3);
    const opts2 = [id, ...wrong2].sort(()=>Math.random()-0.5);
    qs.push({
      key:"sign-find-"+id,
      head:"Welches Schild ist das?",
      question: SIGNS[id].name,
      options: opts2.map(o=>({html:signSvg(o), correct:o===id, signOption:true})),
      why: SIGNS[id].meaning
    });
  });
  return qs;
}

function loadStats(){
  try{ return JSON.parse(localStorage.getItem("rad:stats") || "{}"); }catch(e){ return {}; }
}
function saveStats(s){ try{ localStorage.setItem("rad:stats", JSON.stringify(s)); }catch(e){} }
function noteResult(key, correct){
  const s = loadStats();
  const e = s[key] || {c:0, w:0};
  if(correct) e.c++; else e.w++;
  s[key] = e; saveStats(s);
}
function masteryPct(keys){
  const s = loadStats();
  let done = 0;
  keys.forEach(k=>{ if(s[k] && s[k].c > 0) done++; });
  return keys.length ? Math.round(done/keys.length*100) : 0;
}

function star(filled){
  return `<svg viewBox="0 0 20 20" fill="${filled?'var(--gold)':'var(--paper-edge)'}"><path d="M10 1l2.6 5.9 6.4.6-4.8 4.3 1.4 6.3L10 15l-5.6 3.1 1.4-6.3L1 8.5l6.4-.6z"/></svg>`;
}
function starsRow(n){
  let out=""; for(let i=0;i<5;i++) out += star(i<n);
  return `<div class="stars">${out}</div>`;
}

function pickQuestions(mode){
  const shuffle = a => a.slice().sort(()=>Math.random()-0.5);
  if(mode==="signs") return shuffle(signQuestions()).slice(0, 12);
  if(mode==="row") return shuffle(RIGHT_OF_WAY);
  if(mode==="rules") return shuffle(RULES);
  const mix = shuffle(signQuestions()).slice(0,6)
    .concat(shuffle(RIGHT_OF_WAY).slice(0,5))
    .concat(shuffle(RULES).slice(0,4));
  return shuffle(mix);
}

function startSession(mode){
  session = {mode, qs: pickQuestions(mode), idx:0, right:0, wrong:0, marks:[]};
  renderQuestion();
}

function renderQuestion(){
  const q = session.qs[session.idx];
  const opts = q.options.slice().sort(()=>Math.random()-0.5);
  const twoCols = opts.every(o=>o.signOption) || opts.length<=3;
  app.innerHTML = `
    <a class="back" href="#" id="abort">← Übung beenden</a>
    <div class="progressdots">
      ${session.qs.map((_,i)=>`<i class="${session.marks[i]||(i===session.idx?'now':'')}"></i>`).join("")}
    </div>
    <div class="card">
      <h3>${q.head}</h3>
      ${q.visual ? (q.visual.startsWith("<div") ? q.visual : `<div class="scene">${q.visual}</div>`) : ``}
      ${q.question ? `<div class="qtext">${q.question}</div>` : ``}
      <div class="choices ${twoCols?'two':''}">
        ${opts.map((o,i)=>`<button class="choice ${o.signOption?'sign':''}" data-i="${i}">${o.html || o.label}</button>`).join("")}
      </div>
      <div class="feedback" id="fb"></div>
    </div>`;
  app.querySelector("#abort").onclick = e=>{ e.preventDefault(); renderStart(); };
  const fb = app.querySelector("#fb");
  let attempts = 0, settled = false;
  app.querySelectorAll(".choice").forEach((btn,i)=>{
    btn.onclick = ()=>{
      if(settled || btn.classList.contains("wrong")) return;
      const o = opts[i];
      attempts++;
      if(o.correct){
        settled = true;
        btn.classList.add("correct");
        fb.className = "feedback ok";
        fb.innerHTML = (attempts===1 ? "Richtig! 🎉" : "Richtig!") + `<div class="why">${q.why}</div>`;
        /* "done" zählt nur der Treffer im ersten Anlauf – der zweite gilt als geübt, nicht als gekonnt. */
        session.marks[session.idx] = attempts===1 ? "done" : "miss";
        session.right++;
        noteResult(q.key, attempts===1);
        setTimeout(next, attempts===1 ? 1900 : 2600);
      }else if(attempts<2){
        btn.classList.add("wrong");
        btn.disabled = true;
        fb.className = "feedback no";
        fb.textContent = "Noch nicht – überleg nochmal.";
      }else{
        settled = true;
        btn.classList.add("wrong");
        app.querySelectorAll(".choice").forEach((b,j)=>{ if(opts[j].correct) b.classList.add("correct"); });
        fb.className = "feedback no";
        fb.innerHTML = `Das war leider falsch.<div class="why">${q.why}</div>`;
        session.marks[session.idx] = "miss";
        session.wrong++;
        noteResult(q.key, false);
        setTimeout(next, 3200);
      }
    };
  });
}

function next(){
  session.idx++;
  if(session.idx >= session.qs.length) renderSummary();
  else renderQuestion();
}

function renderSummary(){
  const total = session.qs.length;
  const firstTry = session.marks.filter(m=>m==="done").length;
  const pct = Math.round(firstTry/total*100);
  const stars = pct>=95?5:pct>=85?4:pct>=70?3:pct>=50?2:pct>0?1:0;
  const titel = session.mode==="exam"
    ? (pct>=80 ? "Bestanden! 🏅" : "Fast – übt das nochmal")
    : "Übung geschafft!";
  app.innerHTML = `
    ${header()}
    <div class="card" style="margin-top:20px;">
      <div style="font-size:42px;">${pct>=80?"🏅":"💪"}</div>
      <h3 style="color:var(--ink);font-size:20px;margin:8px 0 2px;">${titel}</h3>
      ${starsRow(stars)}
      <div class="result-line">${firstTry} von ${total} auf Anhieb richtig</div>
      ${session.mode==="exam" && pct<80 ? `<div class="why" style="margin-top:10px;">Bei der echten Prüfung solltest du fast alles richtig haben – üb die schwierigen Bereiche nochmal einzeln.</div>` : ``}
      <div class="btn-row">
        <button class="btn btn-primary" id="again">Nochmal üben</button>
        <button class="btn btn-ghost" id="home">Zur Übersicht</button>
      </div>
    </div>`;
  app.querySelector("#again").onclick = ()=>startSession(session.mode);

}

renderStart();
})();
